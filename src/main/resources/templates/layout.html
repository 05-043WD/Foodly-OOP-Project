<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Foodly</title>
    <link rel="stylesheet" th:href="@{/css/foodly.css}">
    <!-- Bootstrap 5 for modal/button components -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:fragment="navbar" class="navbar">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto;">
        <a th:href="@{/}" class="navbar-brand">Food<span>ly</span></a>

        <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
            <a th:href="@{/}" class="nav-link">Menu</a>

            <!-- Not Logged In -->
            <a th:if="${!isLoggedIn}" th:href="@{/login}" class="nav-link">Login</a>
            <a th:if="${!isLoggedIn}" th:href="@{/register}" class="btn-nav-cta">Register</a>

            <!-- Logged In as Regular User (non-admin) -->
            <a th:if="${isLoggedIn and !isAdmin}" th:href="@{/profile}" class="nav-link">My Profile</a>
            <a th:if="${isLoggedIn and !isAdmin}" th:href="@{/orders/history}" class="nav-link">Order History</a>
            
            <!-- Standard Cart Link Accessible to Everyone Logged In -->
            <a th:if="${isLoggedIn}" th:href="@{/cart}" class="nav-link" style="display: flex; align-items: center; gap: 0.3rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                Cart
            </a>

            <!-- Admin Module Quick Links -->
            <a th:if="${isAdmin}" th:href="@{/admin/menu}"    class="nav-link">Food Menu</a>
            <a th:if="${isAdmin}" th:href="@{/admin/orders}"  class="nav-link">Orders</a>
            <a th:if="${isAdmin}" th:href="@{/admin/staff}"   class="nav-link">Staff</a>
            <a th:if="${isAdmin}" th:href="@{/admin/promos}"  class="nav-link">Promos</a>
            <a th:if="${isAdmin}" th:href="@{/admin/reviews}" class="nav-link">Reviews</a>
            <a th:if="${isAdmin}" th:href="@{/admin/users}"   class="nav-link">Users</a>

            <!-- Shared: Logout -->
            <a th:if="${isLoggedIn}" th:href="@{/logout}" class="nav-link">Logout</a>

            <!-- Admin Dashboard CTA -->
            <a th:if="${isAdmin}" th:href="@{/admin}" class="btn-nav-cta">Dashboard</a>
        </div>
    </div>
</nav>

<footer th:fragment="footer">
    <p>&copy; 2024 Food<span>ly</span>. Fresh food delivered fast.</p>
    <!-- Bootstrap 5 JS bundle (required for modals) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
