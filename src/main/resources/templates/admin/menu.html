<!DOCTYPE html>
<!-- Module: Member 2 - Food Menu Management -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${pageTitle})}">
    <title>Food Menu</title>
</head>
<body class="page-enter">

<div th:replace="~{layout :: navbar}"></div>

<div class="admin-wrapper">
<div style="max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem;">
    <!-- UI Element 1: List View with Add Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Food Menu Dashboard</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addFoodModal">
            + Add New Dish
        </button>
    </div>

    <!-- MAIN LIST UI -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div th:if="${successMessage}" class="alert alert-success mt-2" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger mt-2" th:text="${errorMessage}"></div>

            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Dish Name</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Availability</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${foodItems}">
                    <td th:text="${item.id}">FOOD123</td>
                    <td th:text="${item.name}">Pizza</td>
                    <td th:text="${'$' + item.price}">$10.00</td>
                    <td th:text="${item.category}">Mains</td>
                    <td>
                        <span class="badge" th:classappend="${item.available ? 'bg-success' : 'bg-secondary'}" th:text="${item.available ? 'Available' : 'Unavailable'}">Available</span>
                    </td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-secondary" 
                                data-bs-toggle="modal" 
                                data-bs-target="#editFoodModal"
                                th:data-id="${item.id}"
                                th:data-name="${item.name}"
                                th:data-description="${item.description}"
                                th:data-price="${item.price}"
                                th:data-category="${item.category}"
                                th:data-image="${item.imageUrl}"
                                th:data-available="${item.available}">
                            Edit Value
                        </button>
                        <a th:href="@{/admin/menu/delete/{id}(id=${item.id})}" 
                           class="btn btn-sm btn-outline-danger ms-1"
                           onclick="return confirm('Delete this dish?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(foodItems)}">
                    <td colspan="6" class="text-center text-muted">No food items added yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- UI Element 2: Action Modal for ADDING -->
    <div class="modal fade" id="addFoodModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" th:action="@{/admin/menu/add}" method="post" th:object="${newFood}">
          <div class="modal-header">
            <h5 class="modal-title">Add New Dish</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Dish Name</label>
              <input type="text" class="form-control" th:field="*{name}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" th:field="*{description}" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Price ($)</label>
              <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select class="form-select" th:field="*{category}">
                <option value="Mains">Mains</option>
                <option value="Sides">Sides</option>
                <option value="Drinks">Drinks</option>
                <option value="Desserts">Desserts</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Image URL</label>
              <input type="url" class="form-control" th:field="*{imageUrl}" placeholder="http://...">
            </div>
            <div class="form-check form-switch mb-3">
              <!-- Using hidden input workaround for checkboxes -->
              <input class="form-check-input" type="checkbox" th:field="*{available}" value="true" checked>
              <label class="form-check-label">Available for Order</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Add Dish</button>
          </div>
        </form>
      </div>
    </div>

    <!-- UI Element 3: Action Modal for EDITING -->
    <div class="modal fade" id="editFoodModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" th:action="@{/admin/menu/edit}" method="post">
          <div class="modal-header">
            <h5 class="modal-title">Edit Dish</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="id" id="edit-id">
            
            <div class="mb-3">
              <label class="form-label">Dish Name</label>
              <input type="text" class="form-control" id="edit-name" name="name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="edit-description" name="description" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Price ($)</label>
              <input type="number" step="0.01" class="form-control" id="edit-price" name="price" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select class="form-select" id="edit-category" name="category">
                <option value="Mains">Mains</option>
                <option value="Sides">Sides</option>
                <option value="Drinks">Drinks</option>
                <option value="Desserts">Desserts</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Image URL</label>
              <input type="url" class="form-control" id="edit-image" name="imageUrl">
            </div>
            <div class="form-check form-switch mb-3">
              <input type="hidden" name="available" value="false">
              <input class="form-check-input" type="checkbox" id="edit-available" name="available" value="true">
              <label class="form-check-label">Available for Order</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Simple JavaScript to dynamically map edit parameters for Modals (Easy for Viva explanation) -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const editFoodModal = document.getElementById('editFoodModal');
        if (editFoodModal) {
            // Triggered exactly when the Edit modal is about to be shown
            editFoodModal.addEventListener('show.bs.modal', function (event) {
                // Get the button that triggered the edit action
                const button = event.relatedTarget;
                
                // Read the 'data-*' attributes from the clicked button and inject into modal input fields
                editFoodModal.querySelector('#edit-id').value = button.getAttribute('data-id');
                editFoodModal.querySelector('#edit-name').value = button.getAttribute('data-name');
                editFoodModal.querySelector('#edit-description').value = button.getAttribute('data-description');
                editFoodModal.querySelector('#edit-price').value = button.getAttribute('data-price');
                editFoodModal.querySelector('#edit-category').value = button.getAttribute('data-category');
                editFoodModal.querySelector('#edit-image').value = button.getAttribute('data-image');
                editFoodModal.querySelector('#edit-available').checked = (button.getAttribute('data-available') === 'true');
            });
        }
      });
    </script>
</div>
</div>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>
