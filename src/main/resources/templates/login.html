<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${pageTitle})}">
    <title>Login - Foodly</title>
</head>
<body class="page-enter">

    <!-- Include Navbar -->
    <div th:replace="~{layout :: navbar}"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-card-logo">Food<span>ly</span></div>
            <p class="auth-card-subtitle">Welcome back! Please login to your account</p>
            
            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert-foodly alert-error-foodly" style="margin-bottom: 1.5rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span th:text="${errorMessage}">Error Message</span>
            </div>

            <!-- Basic form targeting the POST /login endpoint handled by Scanner -->
            <form th:action="@{/login}" method="post">
                
                <div style="margin-bottom: 1.25rem;">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="john@example.com" style="width: 100%;">
                </div>
                
                <div style="margin-bottom: 2rem;">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••" style="width: 100%;">
                </div>
                
                <button type="submit" class="btn-primary-foodly">Login</button>
                
            </form>
            
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <span style="color: var(--gray);">Don't have an account?</span> 
                <a href="/register" style="color: var(--orange); text-decoration: none; font-weight: 600;">Register here</a>
            </div>
            
        </div>
    </div>

    <!-- Include Footer -->
    <div th:replace="~{layout :: footer}"></div>

</body>
</html>
