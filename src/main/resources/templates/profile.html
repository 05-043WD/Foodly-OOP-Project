<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${pageTitle})}">
    <title>Profile - Foodly</title>
</head>
<body class="page-enter">

    <!-- Include Navbar -->
    <div th:replace="~{layout :: navbar}"></div>

    <main style="max-width: 800px; margin: 4rem auto; padding: 0 1.5rem; min-height: calc(100vh - 280px);">
        
        <!-- Success Message -->
        <div th:if="${successMessage}" class="alert-foodly alert-success-foodly" style="margin-bottom: 2rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <span th:text="${successMessage}">Success Message</span>
        </div>

        <div class="profile-card">
            
            <div class="profile-header">
                <div class="profile-avatar" th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">U</div>
                <div>
                    <h2 class="profile-name" th:text="${user.name}">User Name</h2>
                    <span class="profile-role-badge" th:text="${user.role}">USER</span>
                </div>
            </div>
            
            <div class="profile-body">
                
                <div class="profile-info-row">
                    <div class="profile-info-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </div>
                    <div>
                        <div class="profile-info-label">Email Address</div>
                        <div class="profile-info-value" th:text="${user.email}">email@example.com</div>
                    </div>
                </div>
                
                <div class="profile-info-row">
                    <div class="profile-info-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    </div>
                    <div>
                        <div class="profile-info-label">Phone Number</div>
                        <div class="profile-info-value" th:text="${user.phone}">+1 555 0000</div>
                    </div>
                </div>
                
                <div class="profile-info-row">
                    <div class="profile-info-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    </div>
                    <div>
                        <div class="profile-info-label">Delivery Address</div>
                        <div class="profile-info-value" th:text="${user.address}">123 Main St, City</div>
                    </div>
                </div>

                <div style="margin-top: 2.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                    <a href="/" class="btn-primary-foodly" style="display: inline-block; width: auto; padding: 0.6rem 2rem; text-decoration: none;">View Menu</a>
                    
                    <a href="/delete-account" style="color: #FF3B30; font-size: 0.85rem; font-weight: 600; text-decoration: underline;" onclick="return confirm('Are you sure you want to permanently delete your account? This action cannot be undone.');">Delete My Account</a>
                </div>
                
            </div>
            
        </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{layout :: footer}"></div>

</body>
</html>
