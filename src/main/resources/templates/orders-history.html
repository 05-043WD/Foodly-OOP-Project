<!DOCTYPE html>
<!-- Module: Member 3 - Order Tracking (Customer View) -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${pageTitle})}">
    <title>Order History</title>
</head>
<body class="page-enter">

<div th:replace="~{layout :: navbar}"></div>

<div class="admin-wrapper" style="background-color: transparent; padding-top: 2rem;">
    <div style="max-width: 1000px; margin: 0 auto; padding: 0 1.5rem;">
        
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--charcoal); margin-bottom: 2rem;">My Order History</h1>
        
        <div th:if="${successMessage}" class="alert-foodly alert-success-foodly" style="margin-bottom: 1.5rem;">
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(orders)}" style="background: white; border-radius: 12px; padding: 4rem 2rem; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--gray-light)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem;"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <h3 style="color: var(--gray); font-weight: 600; margin-bottom: 1rem;">No orders found.</h3>
            <p style="color: var(--gray-light); margin-bottom: 2rem;">Looks like you haven't placed any orders yet!</p>
            <a th:href="@{/}" class="btn-primary-foodly" style="text-decoration: none; padding: 0.8rem 2rem;">Browse Menu</a>
        </div>

        <!-- Orders List -->
        <div th:if="${!#lists.isEmpty(orders)}" style="display: flex; flex-direction: column; gap: 1.5rem;">
            
            <div th:each="order : ${orders}" style="background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden;">
                <!-- Card Header -->
                <div style="background: var(--off-white); padding: 1.2rem 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <div style="font-size: 0.85rem; color: var(--gray-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.3rem;">Order ID <span th:text="${order.id}"></span></div>
                        <div style="font-weight: 700; color: var(--charcoal); font-size: 1.1rem;">
                            Total: <span style="color: var(--accent);" th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span>
                        </div>
                    </div>
                    <div>
                        <!-- Beautiful Status Pill -->
                        <span th:if="${order.status == 'Pending'}" style="background: #FFF3CD; color: #856404; padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem;">
                            <span style="width: 8px; height: 8px; border-radius: 50%; background: #FFC107;"></span> Pending
                        </span>
                        <span th:if="${order.status == 'Preparing'}" style="background: #CCE5FF; color: #004085; padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem;">
                            <span style="width: 8px; height: 8px; border-radius: 50%; background: #007BFF;"></span> Preparing
                        </span>
                        <span th:if="${order.status == 'Out for Delivery'}" style="background: #D4EDDA; color: #155724; padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem;">
                            <span style="width: 8px; height: 8px; border-radius: 50%; background: #28A745;"></span> Out for Delivery
                        </span>
                        <span th:if="${order.status == 'Delivered'}" style="background: #E8F5E9; color: #1B5E20; padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Delivered
                        </span>
                        <span th:if="${order.status == 'Cancelled'}" style="background: #F8D7DA; color: #721C24; padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem;">
                            <span style="width: 8px; height: 8px; border-radius: 50%; background: #DC3545;"></span> Cancelled
                        </span>
                    </div>
                </div>
                
                <!-- Card Body -->
                <div style="padding: 1.5rem;">
                    <h4 style="font-size: 1rem; color: var(--gray); margin-bottom: 1rem; font-weight: 600;">Order Items</h4>
                    <p style="color: var(--charcoal); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem;" th:text="${order.itemsSummary}">1x Burger, 2x Fries</p>
                    
                    <h4 style="font-size: 1rem; color: var(--gray); margin-bottom: 0.5rem; font-weight: 600;">Delivering To</h4>
                    <p style="color: var(--charcoal); font-size: 0.95rem;" th:text="${order.deliveryAddress}">123 Fast Food Lane</p>
                </div>
            </div>
            
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

</body>
</html>
